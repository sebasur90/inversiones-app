services:
  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8087,http://localhost:80,http://smoa7001lx:8087
      - NO_PROXY=localhost,127.0.0.1,.googleapis.com,.google.com
      - no_proxy=localhost,127.0.0.1,.googleapis.com,.google.com
      - USE_LOCAL_SHEET=true
      # Proxy variables for runtime (if needed)
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    volumes:
      # Google Service Account - mount from local credentials directory (read-only)
      - ./credentials/google-service-account.json:/app/data/google-service-account.json:ro
      # Local Excel file for development environment (read-only)
      - ./sheet_local:/app/sheet_local:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    ports:
      - "8087:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
